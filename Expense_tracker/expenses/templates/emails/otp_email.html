<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px;">
    <div style="max-width: 500px; margin: auto; background: #ffffff; border-radius: 8px; padding: 30px; text-align: center;">
        <h2 style="color: #2c3e50;">Hi {{ user_name }},</h2>
        <p style="color: #555;">Use this code to verify your email address:</p>
        <div style="font-size: 32px; font-weight: bold; letter-spacing: 8px; color: #2c3e50; background: #f4f4f4; padding: 15px; border-radius: 8px; margin: 20px 0;">
            {{ otp_code }}
        </div>
        <p style="color: #999; font-size: 13px;">This code expires in 10 minutes.</p>
    </div>
</body>
</html>
