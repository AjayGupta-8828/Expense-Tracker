<html>
    <>head>
        <title>Budget Tracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>  
      <nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="/tasks/">Budget tracker</a>
    </nav>
    <div class="container mt-4">
        <form method="post">
            {% csrf_token %}  
            <div class="form-group">
                <label for="budget">Update your budget:</label><br>
                <label for="category"><u>Category:</u>   <b>{{ budget.category }}</b></label>
            
        <input type="number" class="form-control" id="limit" name="limit" step="10" value="{{ budget.limit }}" placeholder="Enter new budget">
            </div>
        <button type="submit" class="btn btn-primary mt-2">Update Budget</button>
        </form>
    </div>

  </body>
</html>
