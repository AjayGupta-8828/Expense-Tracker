<html>
<head>
    <title>Add Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="/tasks/">All Transactions</a>
    <a href="/transactions/" style="text-decoration:none;margin-left:1050px"><button class="btn btn-success">Go to Transaction List</button></a>
    <form class="d-flex" role="search">
      {% if request.user.is_authenticated%}
        <a href='/logout/' class="btn btn-success" type="submit">Logout</a>
      {% else %}
        <a href='/login/' class="btn btn-success" type="submit">Login</a>
      {%endif%}
    </form>
  </nav>
    <h1>Add Transaction</h1>
    <form method="post">
        {% csrf_token %}
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" required>
        <br>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" step="10" required>
        <br>
        <label for="types">Type:</label>
        <select id="types" name="types" required>
            <option value="Income">Income</option>
            <option value="Expense">Expense</option>
        </select>
        <br>
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="Salary">Salary</option>
            <option value="Food">Food</option>
            <option value="Groceries">Groceries</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date">
        <br>
        <button type="submit">Add Transaction</button>
    </form>
    <a href="{% url 'transactions' %}">Back to Transactions</a>
</body>
</html>
