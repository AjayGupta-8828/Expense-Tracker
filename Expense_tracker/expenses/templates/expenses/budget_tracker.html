<html>
    <>head>
        <title>Budget Tracker</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>  
      <nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="/tasks/">Budget tracker</a>
    </nav>
    <div class="container mt-4">
        <form method="post">
            {% csrf_token %}  
            <div class="form-group">
                <label for="budget">Enter your budget:</label>
                <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="Food">Food</option>
            <option value="Groceries">Groceries</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Bills">Bills</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>
        <input type="number" class="form-control" id="limit" name="limit" step="10" placeholder="Enter your budget">
            </div>
        <button type="submit" class="btn btn-primary mt-2">Set Budget</button>
        </form>
    </div>

  </body>
</html>
