<html>
<head>
    <title>Add Transaction</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary px-4">
    <a class="navbar-brand" href="/tasks/">All Transactions</a>
    <a href="/transactions/" style="text-decoration:none;margin-left:1050px"><button class="btn btn-success">Go to Transaction List</button></a>
    <form class="d-flex" role="search">
      {% if request.user.is_authenticated%}
        <a href='/logout/' class="btn btn-success" type="submit">Logout</a>
      {% else %}
        <a href='/login/' class="btn btn-success" type="submit">Login</a>
      {%endif%}
    </form>
  </nav>
    <h1>Update Transaction</h1>
    <form method="post">
        {% csrf_token %}
        <label for="title">Title:</label>
        <input type="text" id="title" name="title" value="{{ task.title }}" required>
        <br>
        <label for="amount">Amount:</label>
        <input type="number" id="amount" name="amount" step="10" value="{{ task.amount }}" required>
        <br>
        <label for="types">Type:</label>
        <select id="types" name="types" required>
            <option value="Income" {% if task.types == "Income" %}selected{% endif %}>Income</option>
            <option value="Expense" {% if task.types == "Expense" %}selected{% endif %}>Expense</option>
        </select>
        <br>
        <label for="category">Category:</label>
        <select id="category" name="category" required>
            <option value="Salary" {% if task.category == "Salary" %}selected{% endif %}>Salary</option>
            <option value="Food" {% if task.category == "Food" %}selected{% endif %}>Food</option>
            <option value="Groceries" {% if task.category == "Groceries" %}selected{% endif %}>Groceries</option>
            <option value="Travel" {% if task.category == "Travel" %}selected{% endif %}>Travel</option>
            <option value="Shopping" {% if task.category == "Shopping" %}selected{% endif %}>Shopping</option>
            <option value="Bills" {% if task.category == "Bills" %}selected{% endif %}>Bills</option>
            <option value="Entertainment" {% if task.category == "Entertainment" %}selected{% endif %}>Entertainment</option>
            <option value="Other" {% if task.category == "Other" %}selected{% endif %}>Other</option>
        </select>
        <br>
        <label for="date">Date:</label>
        <input type="date" id="date" name="date" value="{{ task.date }}">
        <br>
        <button type="submit">Update transaction</button>
    </form>
    <a href="{% url 'transactions' %}">Back to Transactions</a>
</body>
</html>
